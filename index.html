<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Expense Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07111f,#102d46,#07111f);
    color:white;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
    padding:30px 0 60px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    font-size:52px;
}

h1{
    font-size:clamp(30px,5vw,48px);
    margin:8px 0;
}

.subtitle{
    color:#aebed0;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:22px;
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.stat small{
    color:#aebed0;
}

.stat h2{
    margin-top:10px;
    font-size:27px;
}

.main{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:20px;
}

h3{
    margin-bottom:18px;
}

label{
    display:block;
    color:#c9d5e1;
    font-size:14px;
    margin:15px 0 7px;
}

input,select{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.25);
    color:white;
    outline:none;
}

option{
    color:#111;
}

button{
    cursor:pointer;
    border:0;
    border-radius:11px;
    font-weight:bold;
}

.add{
    width:100%;
    padding:14px;
    margin-top:20px;
    color:white;
    background:linear-gradient(135deg,#1677ff,#4d9cff);
}

.toolbar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.toolbar input{
    max-width:210px;
}

.expense{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    font-size:27px;
}

.name{
    font-weight:bold;
}

.date{
    color:#91a5b8;
    font-size:12px;
    margin-top:4px;
}

.amount{
    font-weight:bold;
    white-space:nowrap;
}

.delete{
    margin-left:8px;
    padding:7px 9px;
    background:rgba(255,70,70,.15);
    color:#ffaaaa;
}

.empty{
    text-align:center;
    color:#91a5b8;
    padding:40px 10px;
}

.budget{
    margin-top:25px;
}

.progress{
    height:12px;
    background:rgba(255,255,255,.1);
    border-radius:20px;
    overflow:hidden;
    margin-top:12px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#38d39f;
    transition:.4s;
}

.ai{
    margin-top:20px;
    text-align:center;
}

.ai p{
    color:#aebed0;
    margin-bottom:15px;
}

.ai button{
    padding:13px 22px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    color:white;
}

#aiResult{
    margin-top:18px;
    padding:18px;
    border-radius:15px;
    background:rgba(0,0,0,.2);
    color:#dbe7f3;
    line-height:1.6;
}

footer{
    text-align:center;
    margin-top:30px;
    color:#71849a;
    font-size:13px;
}

@media(max-width:900px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .main{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }

    .toolbar input{
        max-width:none;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">💰</div>

<h1>Smart Expense Tracker</h1>

<p class="subtitle">
Track • Analyse • Budget • Save
</p>

</header>


<section class="dashboard">

<div class="card stat">
<small>Today's Spending</small>
<h2 id="today">₹0.00</h2>
</div>

<div class="card stat">
<small>This Month</small>
<h2 id="month">₹0.00</h2>
</div>

<div class="card stat">
<small>Total Spending</small>
<h2 id="total">₹0.00</h2>
</div>

<div class="card stat">
<small>Transactions</small>
<h2 id="count">0</h2>
</div>

</section>


<div class="main">


<section class="card">

<h3>➕ Add Expense</h3>

<form id="expenseForm">

<label>Amount (₹)</label>

<input
id="amount"
type="number"
min="0.01"
step="0.01"
placeholder="Example: 250"
required
>


<label>Category</label>

<select id="category">

<option>🍛 Food</option>
<option>🚌 Travel</option>
<option>🛍️ Shopping</option>
<option>📚 Education</option>
<option>🏠 Bills</option>
<option>🎬 Entertainment</option>
<option
